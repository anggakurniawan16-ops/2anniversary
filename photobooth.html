<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Photobooth | Angga & Tsania</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose: #b76e79;
            --rose-deep: #8b5a6c;
            --rose-pale: #f2d7df;
            --cream: #fdf8f5;
            --text-dark: #3d2c2c;
            --text-mid: #7d6363;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream); min-height: 100vh;
            padding: 50px 20px 60px;
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-dark); overflow-x: hidden; position: relative;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.025; pointer-events: none; z-index: 0;
        }
        .blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
        .blob-1 { width: 400px; height: 400px; background: radial-gradient(circle,#f4b8c8 0%,transparent 70%); top: -80px; right: -80px; }
        .blob-2 { width: 350px; height: 350px; background: radial-gradient(circle,#dbb8e8 0%,transparent 70%); bottom: -60px; left: -60px; }

        .music-btn {
            position: fixed; bottom: 24px; right: 24px;
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--rose-deep); color: white; border: none; cursor: pointer;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(139,90,108,0.35); z-index: 1000;
            transition: transform 0.3s ease;
        }
        .music-btn:hover { transform: scale(1.1); }

        /* ── HEADER ── */
        .page-header { text-align: center; margin-bottom: 36px; position: relative; z-index: 1; }
        .hero-label {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.68rem; letter-spacing: 4px; text-transform: uppercase; color: var(--rose);
            background: rgba(183,110,121,0.07); border: 1px solid rgba(183,110,121,0.15);
            border-radius: 100px; padding: 6px 18px; margin-bottom: 16px;
        }
        .page-header h2 {
            font-family: 'Cormorant Garamond', serif; font-weight: 300;
            font-size: clamp(2.2rem, 5vw, 3.2rem); letter-spacing: -1px; color: var(--text-dark); margin-bottom: 4px;
        }
        .page-header h2 em { font-style: italic; color: var(--rose-deep); }
        .page-header p { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-mid); }

        /* ── FILTER BAR ── */
        .filter-bar {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            margin-bottom: 28px; position: relative; z-index: 1;
        }
        .filter-chip {
            padding: 7px 18px; border: 1px solid rgba(139,90,108,0.25);
            border-radius: 100px; background: white; color: var(--text-mid);
            font-size: 0.78rem; font-family: 'DM Sans', sans-serif; cursor: pointer;
            transition: all 0.25s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .filter-chip:hover { border-color: var(--rose); color: var(--rose); }
        .filter-chip.active {
            background: var(--rose-deep); color: white; border-color: var(--rose-deep);
            box-shadow: 0 4px 14px rgba(139,90,108,0.3);
        }

        /* ── WORKSPACE ── */
        .workspace {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 36px; max-width: 1020px; width: 100%; position: relative; z-index: 1;
        }

        /* ── CAMERA BOX ── */
        .camera-box {
            background: white; padding: 24px; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(60,30,30,0.1);
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 440px;
        }

        /*
         * FIX KAMERA HP GEPENG:
         * video-container pakai aspect-ratio 4/3 dan overflow:hidden.
         * liveCanvas mengisi penuh container dengan object-fit:cover behaviour
         * melalui width/height 100% + position absolute.
         * video disembunyikan (opacity:0) karena kita gambar ke canvas.
         */
        .video-container {
            position: relative; width: 100%; aspect-ratio: 4/3;
            border-radius: 12px; overflow: hidden; background: #111;
        }
        #webcam {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; /* kunci agar tidak gepeng */
            transform: scaleX(-1);
            opacity: 0; /* disembunyikan, kita pakai canvas */
            pointer-events: none;
        }
        /* Canvas live: ukurannya selalu sama dengan container via CSS,
           konten di dalamnya di-crop pakai drawImage dengan perhitungan cover */
        #liveCanvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border-radius: 12px;
            /* TIDAK pakai CSS filter di sini — filter diterapkan saat drawImage */
        }
        #ornamentCanvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none; border-radius: 12px;
        }

        .timer-overlay {
            position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.15); color: white;
            font-family: 'Cormorant Garamond', serif; font-size: 7rem; font-weight: 300;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 10;
        }
        .flash-el {
            position: absolute; inset: 0; background: white; opacity: 0;
            pointer-events: none; z-index: 11; border-radius: 12px;
        }

        /* Progress */
        .progress-dots { display: flex; gap: 10px; margin: 16px 0 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--rose-pale); background: transparent; transition: all 0.3s ease; }
        .dot.filled { background: var(--rose); border-color: var(--rose); }
        .dot.active { background: transparent; border-color: var(--rose); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.3);box-shadow:0 0 0 4px rgba(183,110,121,0.2);} }

        .capture-status { font-size: 0.82rem; font-weight: 500; color: var(--rose-deep); margin-bottom: 16px; letter-spacing: 0.3px; }
        .action-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }

        /* ── PHOTOSTRIP ── */
        .photostrip-container { width: 100%; max-width: 340px; }
        .strip-label { text-align: center; font-size: 0.68rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-mid); margin-bottom: 12px; }

        .photostrip {
            background: white; padding: 20px 20px 28px;
            box-shadow: 0 30px 70px rgba(60,30,30,0.15); position: relative;
        }
        .photostrip::before, .photostrip::after {
            content: ''; position: absolute; top: -10px;
            width: 40px; height: 20px; background: rgba(255,218,224,0.8);
        }
        .photostrip::before { left: 18px; transform: rotate(-4deg); }
        .photostrip::after  { right: 18px; transform: rotate(4deg); }

        .pb-frame {
            width: 100%; aspect-ratio: 4/3; background: #f0ebe5;
            margin-bottom: 10px; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            color: #bbb; font-size: 0.72rem; font-style: italic; position: relative;
        }
        /* Canvas dalam frame: isi penuh dengan cover behaviour */
        .pb-frame canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .pb-footer { text-align: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(183,110,121,0.2); }
        .pb-footer .names { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; color: var(--text-dark); margin-bottom: 3px; }
        .pb-footer .date  { font-size: 0.62rem; letter-spacing: 4px; color: var(--rose); }

        /* ── BUTTONS ── */
        .btn {
            padding: 11px 22px; background: transparent; color: var(--rose-deep);
            border: 1px solid var(--rose-deep); border-radius: 4px; cursor: pointer;
            font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 500;
            letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.3s ease;
        }
        .btn:hover { background: var(--rose-deep); color: white; }
        .btn-capture { background: var(--rose-deep); color: white; border: none; padding: 13px 30px; box-shadow: 0 6px 20px rgba(139,90,108,0.3); }
        .btn-capture:hover { background: var(--rose); transform: translateY(-1px); }
        .btn-capture:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-undo { border-style: dashed; }
        .btn-undo:hover { background: var(--rose-pale); color: var(--rose-deep); }
        .btn-download {
            display: block; width: 100%; margin-top: 16px;
            background: var(--text-dark); color: white; border: none; padding: 14px;
            text-align: center; font-size: 0.8rem; letter-spacing: 1.5px;
            cursor: pointer; font-family: 'DM Sans', sans-serif; text-transform: uppercase;
            transition: background 0.3s ease;
        }
        .btn-download:hover { background: #2a1a1a; }
        .btn-back { margin-top: 36px; border-color: rgba(139,90,108,0.3); color: var(--text-mid); }

        /* ── FILTER NAME BADGE on live view ── */
        .filter-badge {
            position: absolute; bottom: 10px; left: 10px; z-index: 5;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
            color: white; font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase;
            padding: 4px 10px; border-radius: 100px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <audio id="lagu-romantis" loop><source src="musik/musik.mp3" type="audio/mpeg"></audio>
    <button class="music-btn" id="musicBtn" onclick="toggleMusik()">🎵</button>

    <div class="page-header">
        <div class="hero-label">📸 &nbsp; live photobooth &nbsp; 📸</div>
        <h2>our <em>photobooth.</em></h2>
        <p>capture your happy moments</p>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
        <button class="filter-chip active"  onclick="setFilter('normal',  this)">✨ Normal</button>
        <button class="filter-chip"         onclick="setFilter('warm',    this)">🌅 Warm</button>
        <button class="filter-chip"         onclick="setFilter('bw',      this)">🖤 B&W</button>
        <button class="filter-chip"         onclick="setFilter('vintage', this)">📷 Vintage</button>
        <button class="filter-chip"         onclick="setFilter('pink',    this)">🌸 Pink</button>
        <button class="filter-chip"         onclick="setFilter('dreamy',  this)">🌙 Dreamy</button>
    </div>

    <div class="workspace">
        <!-- Camera -->
        <div class="camera-box">
            <div class="video-container" id="videoContainer">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="liveCanvas"></canvas>
                <canvas id="ornamentCanvas"></canvas>
                <div id="timerOverlay" class="timer-overlay">3</div>
                <div id="flashEl" class="flash-el"></div>
                <div class="filter-badge" id="filterBadge">✨ Normal</div>
            </div>

            <div class="progress-dots" id="progressDots">
                <div class="dot active" id="dot-1"></div>
                <div class="dot"        id="dot-2"></div>
                <div class="dot"        id="dot-3"></div>
            </div>

            <div class="capture-status" id="statusText">Siap berpose? (Butuh 3 foto)</div>

            <div class="action-buttons">
                <button class="btn btn-capture" id="captureBtn" onclick="mulaiCountdown()">📸 &nbsp;Ambil Foto</button>
                <button class="btn btn-undo"    id="undoBtn"    onclick="undoFotoLast()" style="display:none;">↩ Ulang</button>
                <button class="btn" style="border:none;font-size:0.7rem;color:var(--text-mid);background:none;" onclick="resetFoto()">Reset</button>
            </div>
        </div>

        <!-- Photostrip -->
        <div class="photostrip-container">
            <div class="strip-label">preview strip</div>
            <div class="photostrip" id="cetakanFoto">
                <div class="pb-frame" id="frame-1">slot foto 1</div>
                <div class="pb-frame" id="frame-2">slot foto 2</div>
                <div class="pb-frame" id="frame-3">slot foto 3</div>
                <div class="pb-footer">
                    <p class="names">Angga & Tsania</p>
                    <p class="date">19 · 07 · 2024</p>
                </div>
            </div>
            <button class="btn btn-download" onclick="simpanKeGaleri()">💾 &nbsp; Download Hasil Foto</button>
        </div>
    </div>

    <button class="btn btn-back" onclick="kembali()">⬅ &nbsp; back to gallery</button>

    <script>
    /* ═══════════════════════════════════════════════════════
       MUSIK
    ════════════════════════════════════════════════════════ */
    const lagu = document.getElementById('lagu-romantis');
    const musicBtn = document.getElementById('musicBtn');
    window.addEventListener('load', () => {
        const aktif = sessionStorage.getItem('musikAktif') === 'true';
        const waktu = parseFloat(sessionStorage.getItem('musikWaktu') || '0');
        if (aktif) { lagu.currentTime = waktu; lagu.play().catch(()=>{}); musicBtn.textContent='🎵'; }
        else { musicBtn.textContent = '🔇'; }
    });
    setInterval(() => { sessionStorage.setItem('musikWaktu', lagu.currentTime.toString()); }, 300);
    function toggleMusik() {
        if (lagu.paused) { lagu.play().catch(()=>{}); sessionStorage.setItem('musikAktif','true');  musicBtn.textContent='🎵'; }
        else             { lagu.pause();               sessionStorage.setItem('musikAktif','false'); musicBtn.textContent='🔇'; }
    }

    /* ═══════════════════════════════════════════════════════
       SETUP KAMERA & CANVAS

       FIX UTAMA KAMERA HP GEPENG:
       - Canvas internal (W x H) adalah resolusi sumber.
       - saat drawImage, kita hitung cover crop manual supaya
         video tidak terdistorsi walau rasio kamera ≠ 4:3.
       - CSS canvas: width/height 100% agar mengisi kontainer.
    ════════════════════════════════════════════════════════ */
    const video        = document.getElementById('webcam');
    const liveCanvas   = document.getElementById('liveCanvas');
    const liveCtx      = liveCanvas.getContext('2d', { willReadFrequently: true });
    const ornCanvas    = document.getElementById('ornamentCanvas');
    const ornCtx       = ornCanvas.getContext('2d');
    const statusText   = document.getElementById('statusText');
    const timerOverlay = document.getElementById('timerOverlay');
    const captureBtn   = document.getElementById('captureBtn');
    const undoBtn      = document.getElementById('undoBtn');
    const flashEl      = document.getElementById('flashEl');
    const filterBadge  = document.getElementById('filterBadge');

    let fotoCount = 0, isCountingDown = false;
    let sisaFoto = [];
    let currentFilter = 'normal';
    let animFrameId = null;

    // Resolusi internal canvas (output 4:3)
    const W = 640, H = 480;
    liveCanvas.width = ornCanvas.width = W;
    liveCanvas.height = ornCanvas.height = H;

    // Variabel untuk menyimpan crop region video → cover 4:3
    let cropX = 0, cropY = 0, cropW = 0, cropH = 0;

    function calcCoverCrop() {
        /*
         * Hitung sx, sy, sw, sh dari video agar hasil drawImage
         * mengisi canvas W×H tanpa distorsi (cover crop).
         */
        const vW = video.videoWidth  || W;
        const vH = video.videoHeight || H;
        const targetRatio = W / H;   // 4/3
        const sourceRatio = vW / vH;

        if (sourceRatio > targetRatio) {
            // Video lebih lebar → crop kiri-kanan
            cropH = vH;
            cropW = vH * targetRatio;
            cropX = (vW - cropW) / 2;
            cropY = 0;
        } else {
            // Video lebih tinggi → crop atas-bawah
            cropW = vW;
            cropH = vW / targetRatio;
            cropX = 0;
            cropY = (vH - cropH) / 2;
        }
    }

    navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: 'user',    // kamera depan di HP
            width:  { ideal: 1280 },
            height: { ideal: 720  }
        },
        audio: false
    })
    .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play();
            calcCoverCrop();  // hitung crop setelah metadata siap
            startLiveLoop();
        };
    })
    .catch(() => {
        statusText.innerText = "Gagal memuat kamera. Izinkan akses webcam!";
    });

    /* ═══════════════════════════════════════════════════════
       LIVE LOOP

       FIX FILTER BUG:
       - Hapus penggunaan CSS filter pada liveCanvas (penyebab konflik).
       - Semua filter diterapkan murni via pixel data (applyPixelFilter).
       - Ini memastikan hasil di canvas = hasil yang di-snapshot.
       - drawImage pakai crop cover agar gambar HP tidak gepeng.
    ════════════════════════════════════════════════════════ */
    function startLiveLoop() {
        if (animFrameId) cancelAnimationFrame(animFrameId);

        function loop() {
            if (video.readyState >= 2 && cropW > 0) {
                // 1. Flip horizontal (mirror selfie) + crop cover
                liveCtx.save();
                liveCtx.translate(W, 0);
                liveCtx.scale(-1, 1);
                liveCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, W, H);
                liveCtx.restore();

                // 2. Apply pixel filter (satu-satunya cara — tidak ada CSS filter)
                applyPixelFilter(liveCtx, W, H, currentFilter);

                // 3. Apply ornaments di canvas terpisah
                drawOrnaments(ornCtx, W, H, currentFilter);
            }
            animFrameId = requestAnimationFrame(loop);
        }
        loop();
    }

    /* ═══════════════════════════════════════════════════════
       PIXEL FILTER
       - PERBAIKAN: CSS filter dihapus total.
       - Semua efek visual diterapkan di pixel data agar
         hasil live = hasil snapshot = hasil download.
    ════════════════════════════════════════════════════════ */
    function applyPixelFilter(ctx, w, h, filter) {
        if (filter === 'normal') return; // tidak ada perubahan

        const id = ctx.getImageData(0, 0, w, h);
        const d  = id.data;

        for (let i = 0; i < d.length; i += 4) {
            let r = d[i], g = d[i+1], b = d[i+2];

            if (filter === 'warm') {
                // Hangat: naikkan merah, turunkan biru, sedikit naikkan saturasi
                r = Math.min(255, r * 1.15 + 10);
                g = Math.min(255, g * 1.03);
                b = Math.max(0,   b * 0.80);

            } else if (filter === 'bw') {
                // Hitam putih dengan sedikit contrast
                const lum = 0.299*r + 0.587*g + 0.114*b;
                const c = Math.min(255, Math.max(0, (lum - 128) * 1.12 + 128));
                r = g = b = c;

            } else if (filter === 'vintage') {
                // Vintage: sepia + sedikit noise + vignette via gradient
                const lum = 0.299*r + 0.587*g + 0.114*b;
                r = Math.min(255, lum * 1.08 + 22);
                g = Math.min(255, lum * 0.95 + 10);
                b = Math.max(0,   lum * 0.78 + 8);
                const noise = (Math.random() - 0.5) * 14;
                r = Math.min(255, Math.max(0, r + noise));
                g = Math.min(255, Math.max(0, g + noise));
                b = Math.min(255, Math.max(0, b + noise));

            } else if (filter === 'pink') {
                // Pink: naikkan merah & biru, turunkan hijau
                r = Math.min(255, r * 1.08 + 30);
                g = Math.min(255, g * 0.88 + 8);
                b = Math.min(255, b * 1.12 + 22);

            } else if (filter === 'dreamy') {
                // Dreamy: soft blur effect via pixel, warna dingin lavender
                r = Math.min(255, r * 0.82 + 42);
                g = Math.min(255, g * 0.82 + 32);
                b = Math.min(255, b * 1.12 + 42);
            }

            d[i] = r; d[i+1] = g; d[i+2] = b;
        }
        ctx.putImageData(id, 0, 0);
    }

    /* ═══════════════════════════════════════════════════════
       ORNAMEN PER FILTER
    ════════════════════════════════════════════════════════ */
    const particles = Array.from({length:18}, () => ({
        x: Math.random()*640, y: Math.random()*480,
        r: 1+Math.random()*2.5, speed: 0.3+Math.random()*0.7, dx: (Math.random()-0.5)*0.6
    }));

    function drawOrnaments(ctx, w, h, filter) {
        ctx.clearRect(0, 0, w, h);

        if (filter === 'normal') {
            drawHeart(ctx, 18, 18, 10, 'rgba(255,160,180,0.55)');
            drawHeart(ctx, w-18, 18, 10, 'rgba(255,160,180,0.55)');
            drawHeart(ctx, 18, h-18, 10, 'rgba(255,160,180,0.55)');
            drawHeart(ctx, w-18, h-18, 10, 'rgba(255,160,180,0.55)');
            ctx.strokeStyle = 'rgba(255,182,193,0.4)'; ctx.lineWidth = 3;
            ctx.strokeRect(8, 8, w-16, h-16);
        }
        else if (filter === 'warm') {
            drawSunRays(ctx, w, h);
            drawCornerBrackets(ctx, w, h, 'rgba(255,200,80,0.6)', 30);
            for (let i=0; i<6; i++) drawStar(ctx, 40+i*90, 30, 7, 'rgba(255,210,80,0.7)');
        }
        else if (filter === 'bw') {
            ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, w-20, h-20);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
            ctx.strokeRect(18, 18, w-36, h-36);
            drawFilmHoles(ctx, w, h);
        }
        else if (filter === 'vintage') {
            drawVignette(ctx, w, h, 'rgba(60,20,0,0.38)');
            drawVintageCorners(ctx, w, h);
            ctx.strokeStyle = 'rgba(200,160,80,0.5)'; ctx.lineWidth = 2;
            ctx.strokeRect(12, 12, w-24, h-24);
            ctx.strokeStyle = 'rgba(200,160,80,0.25)'; ctx.lineWidth = 1;
            ctx.strokeRect(18, 18, w-36, h-36);
        }
        else if (filter === 'pink') {
            drawSakura(ctx, w, h);
            ctx.strokeStyle = 'rgba(255,140,180,0.55)'; ctx.lineWidth = 3;
            roundRect(ctx, 8, 8, w-16, h-16, 16); ctx.stroke();
            drawBow(ctx, 16, 16, 'rgba(255,120,160,0.7)');
            drawBow(ctx, w-16, 16, 'rgba(255,120,160,0.7)', true);
            drawBow(ctx, 16, h-16, 'rgba(255,120,160,0.7)', false, true);
            drawBow(ctx, w-16, h-16, 'rgba(255,120,160,0.7)', true, true);
        }
        else if (filter === 'dreamy') {
            particles.forEach(p => {
                p.y -= p.speed; p.x += p.dx;
                if (p.y < -10) { p.y = h+10; p.x = Math.random()*w; }
                drawSparkle(ctx, p.x, p.y, p.r, 'rgba(180,160,255,0.8)');
            });
            const grad = ctx.createLinearGradient(0,0,w,h);
            grad.addColorStop(0,'rgba(180,140,255,0.3)');
            grad.addColorStop(0.5,'rgba(255,180,240,0.1)');
            grad.addColorStop(1,'rgba(140,200,255,0.3)');
            ctx.strokeStyle = grad; ctx.lineWidth = 5;
            ctx.strokeRect(6, 6, w-12, h-12);
            drawMoon(ctx, w-30, 30, 14, 'rgba(220,200,255,0.7)');
        }
    }

    /* ── Drawing helpers ── */
    function drawHeart(ctx, x, y, size, color) {
        ctx.save(); ctx.translate(x, y); ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -size*0.3);
        ctx.bezierCurveTo(size*0.5, -size, size*1.0, -size*0.2, 0, size*0.7);
        ctx.bezierCurveTo(-size*1.0, -size*0.2, -size*0.5, -size, 0, -size*0.3);
        ctx.fill(); ctx.restore();
    }
    function drawSunRays(ctx, w, h) {
        const cx=w/2, cy=h/2; ctx.save();
        for (let i=0; i<12; i++) {
            const angle=(i/12)*Math.PI*2;
            const grad=ctx.createLinearGradient(cx,cy,cx+Math.cos(angle)*w,cy+Math.sin(angle)*h);
            grad.addColorStop(0,'rgba(255,200,50,0)'); grad.addColorStop(1,'rgba(255,200,50,0.06)');
            ctx.fillStyle=grad; ctx.beginPath(); ctx.moveTo(cx,cy);
            const a1=angle-0.13,a2=angle+0.13,len=Math.max(w,h)*1.5;
            ctx.lineTo(cx+Math.cos(a1)*len,cy+Math.sin(a1)*len);
            ctx.lineTo(cx+Math.cos(a2)*len,cy+Math.sin(a2)*len);
            ctx.closePath(); ctx.fill();
        }
        ctx.restore();
    }
    function drawCornerBrackets(ctx, w, h, color, size) {
        ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineCap='round';
        [[12,12,1,1],[w-12,12,-1,1],[12,h-12,1,-1],[w-12,h-12,-1,-1]].forEach(([x,y,dx,dy]) => {
            ctx.beginPath(); ctx.moveTo(x,y+dy*size); ctx.lineTo(x,y); ctx.lineTo(x+dx*size,y); ctx.stroke();
        });
    }
    function drawStar(ctx, x, y, r, color) {
        ctx.save(); ctx.translate(x,y); ctx.fillStyle=color; ctx.beginPath();
        for (let i=0;i<5;i++) {
            const a=(i*4*Math.PI/5)-Math.PI/2, ai=((i*4+2)*Math.PI/5)-Math.PI/2;
            i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
            ctx.lineTo(Math.cos(ai)*r*0.45,Math.sin(ai)*r*0.45);
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
    }
    function drawFilmHoles(ctx, w, h) {
        ctx.fillStyle='rgba(255,255,255,0.55)';
        for (let y=28;y<h;y+=28) {
            ctx.beginPath(); ctx.arc(8,y,3.5,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w-8,y,3.5,0,Math.PI*2); ctx.fill();
        }
    }
    function drawVignette(ctx, w, h, color) {
        const grad=ctx.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,h*0.85);
        grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,color);
        ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
    }
    function drawVintageCorners(ctx, w, h) {
        ctx.strokeStyle='rgba(200,160,70,0.65)'; ctx.lineWidth=1.5;
        [[14,14,1,1],[w-14,14,-1,1],[14,h-14,1,-1],[w-14,h-14,-1,-1]].forEach(([x,y,dx,dy]) => {
            ctx.beginPath();
            ctx.arc(x,y,14,dy>0?(dx>0?Math.PI:Math.PI/2):(dx>0?-Math.PI/2:0),
                dy>0?(dx>0?Math.PI*1.5:Math.PI):(dx>0?0:Math.PI/2));
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x,y+dy*18); ctx.lineTo(x,y); ctx.lineTo(x+dx*18,y); ctx.stroke();
        });
    }
    const sakuraArr = Array.from({length:14}, () => ({
        x:Math.random()*640, y:Math.random()*480, r:5+Math.random()*8,
        angle:Math.random()*Math.PI*2, speed:0.4+Math.random()*0.6,
        drift:(Math.random()-0.5)*0.8, spin:(Math.random()-0.5)*0.04
    }));
    function drawSakura(ctx, w, h) {
        sakuraArr.forEach(p => {
            p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
            if(p.y>h+20){p.y=-20;p.x=Math.random()*w;}
            ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle);
            ctx.fillStyle='rgba(255,160,190,0.65)';
            for(let i=0;i<5;i++){
                ctx.save(); ctx.rotate((i/5)*Math.PI*2);
                ctx.beginPath(); ctx.ellipse(0,-p.r*0.6,p.r*0.4,p.r*0.7,0,0,Math.PI*2);
                ctx.fill(); ctx.restore();
            }
            ctx.restore();
        });
    }
    function drawBow(ctx, x, y, color, flipX=false, flipY=false) {
        ctx.save(); ctx.translate(x,y);
        if(flipX)ctx.scale(-1,1); if(flipY)ctx.scale(1,-1);
        ctx.fillStyle=color;
        ctx.beginPath(); ctx.ellipse(-8,-6,10,6,Math.PI/5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(8,-6,10,6,-Math.PI/5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
        ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
        ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
        ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
    }
    function drawSparkle(ctx, x, y, r, color) {
        ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle=color; ctx.lineWidth=r*0.6; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(x-r*2.5,y); ctx.lineTo(x+r*2.5,y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,y-r*2.5); ctx.lineTo(x,y+r*2.5); ctx.stroke();
    }
    function drawMoon(ctx, x, y, r, color) {
        ctx.save(); ctx.translate(x,y); ctx.fillStyle=color;
        ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
        ctx.arc(-r*0.4,-r*0.1,r*0.82,0,Math.PI*2,true);
        ctx.fill(); ctx.restore();
    }

    /* ═══════════════════════════════════════════════════════
       FILTER SELECTION
       FIX: tidak ada lagi CSS filter — hanya update currentFilter
       dan biarkan live loop handle sisanya.
    ════════════════════════════════════════════════════════ */
    const filterNames = {
        normal:'✨ Normal', warm:'🌅 Warm', bw:'🖤 B&W',
        vintage:'📷 Vintage', pink:'🌸 Pink', dreamy:'🌙 Dreamy'
    };
    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        filterBadge.textContent = filterNames[filter] || filter;
        // Tidak perlu restart loop — loop sudah jalan terus,
        // currentFilter akan dipakai di iterasi berikutnya.
    }

    /* ═══════════════════════════════════════════════════════
       PROGRESS DOTS
    ════════════════════════════════════════════════════════ */
    function updateDots() {
        for (let i=1; i<=3; i++) {
            const d = document.getElementById(`dot-${i}`);
            d.className = 'dot';
            if (i <= fotoCount) d.classList.add('filled');
            else if (i === fotoCount+1 && fotoCount < 3) d.classList.add('active');
        }
    }
    updateDots();

    /* ═══════════════════════════════════════════════════════
       COUNTDOWN & CAPTURE
    ════════════════════════════════════════════════════════ */
    function mulaiCountdown() {
        if (fotoCount >= 3) { statusText.innerText = "Strip sudah penuh! Reset untuk mengulang."; return; }
        if (isCountingDown) return;
        isCountingDown = true; captureBtn.disabled = true;
        if (undoBtn) undoBtn.disabled = true;

        let tl = 3;
        timerOverlay.innerText = tl; timerOverlay.style.opacity = '1';
        statusText.innerText = `Bersiap dalam... ${tl}`;

        const iv = setInterval(() => {
            tl--;
            if (tl > 0) {
                timerOverlay.innerText = tl;
                statusText.innerText = `Bersiap dalam... ${tl}`;
            } else {
                clearInterval(iv);
                timerOverlay.style.opacity = '0';
                isCountingDown = false;
                ambilFoto();
            }
        }, 1000);
    }

    function flash() {
        flashEl.style.transition = 'none'; flashEl.style.opacity = '1';
        setTimeout(() => { flashEl.style.transition = 'opacity 0.6s ease'; flashEl.style.opacity = '0'; }, 60);
    }

    function ambilFoto() {
        flash();
        fotoCount++;
        const frame = document.getElementById(`frame-${fotoCount}`);
        frame.innerHTML = '';

        /*
         * Snapshot: salin liveCanvas (sudah terfilter) + ornamen
         * ke canvas baru berukuran W×H (full res).
         */
        const snap = document.createElement('canvas');
        snap.width = W; snap.height = H;
        const sCtx = snap.getContext('2d');
        sCtx.drawImage(liveCanvas, 0, 0);
        sCtx.drawImage(ornCanvas, 0, 0);

        /*
         * Preview di strip: buat canvas display yang mengisi
         * pb-frame (aspect 4:3) — karena snap juga 4:3, tidak ada distorsi.
         */
        const disp = document.createElement('canvas');
        disp.width = W; disp.height = H;
        disp.getContext('2d').drawImage(snap, 0, 0);
        frame.appendChild(disp);

        sisaFoto.push(snap);
        undoBtn.style.display = 'inline-block'; undoBtn.disabled = false;
        updateDots();

        if (fotoCount < 3) {
            statusText.innerText = `Foto ${fotoCount} ✓ — Ambil foto ${fotoCount+1}!`;
            captureBtn.disabled = false;
        } else {
            statusText.innerText = "Yaaay! Strip foto kamu sudah jadi 🎉";
            captureBtn.disabled = true;
        }
    }

    /* ═══════════════════════════════════════════════════════
       UNDO / RESET
    ════════════════════════════════════════════════════════ */
    function undoFotoLast() {
        if (isCountingDown || fotoCount === 0) return;
        document.getElementById(`frame-${fotoCount}`).innerHTML = `slot foto ${fotoCount}`;
        sisaFoto.pop(); fotoCount--;
        undoBtn.style.display = fotoCount === 0 ? 'none' : 'inline-block';
        statusText.innerText = fotoCount === 0
            ? 'Siap berpose? (Butuh 3 foto)'
            : `Foto dihapus. Ambil ulang foto ke-${fotoCount+1}!`;
        captureBtn.disabled = false; updateDots();
    }

    function resetFoto() {
        if (isCountingDown) return;
        fotoCount = 0; sisaFoto = [];
        for (let i=1; i<=3; i++) document.getElementById(`frame-${i}`).innerHTML = `slot foto ${i}`;
        captureBtn.disabled = false; undoBtn.style.display = 'none';
        statusText.innerText = 'Siap berpose kembali? (Butuh 3 foto)'; updateDots();
    }

    /* ═══════════════════════════════════════════════════════
       DOWNLOAD — composite 3 foto ke satu strip PNG
    ════════════════════════════════════════════════════════ */
    function simpanKeGaleri() {
        if (fotoCount < 3) { alert("Jepret 3 foto dulu ya! 😉"); return; }

        const out = document.createElement('canvas');
        out.width = 600; out.height = 1460;
        const ctx = out.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 600, 1460);

        const sW=520, sH=390, mX=40;
        const yPos = [50, 480, 910];

        for (let i=0; i<3; i++) {
            // sisaFoto[i] sudah 4:3 (W×H), target juga 4:3 (sW×sH) → no crop needed
            ctx.drawImage(sisaFoto[i], 0, 0, W, H, mX, yPos[i], sW, sH);
        }

        ctx.strokeStyle = 'rgba(183,110,121,0.2)'; ctx.lineWidth = 2; ctx.setLineDash([8,6]);
        ctx.beginPath(); ctx.moveTo(40,1330); ctx.lineTo(560,1330); ctx.stroke();
        ctx.setLineDash([]);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#3d2c2c'; ctx.font = "italic 300 42px Georgia,serif";
        ctx.fillText('Angga & Tsania', 300, 1392);
        ctx.fillStyle = '#b76e79'; ctx.font = "500 16px Arial,sans-serif";
        ctx.fillText('19  ·  07  ·  2024', 300, 1428);

        const link = document.createElement('a');
        link.download = 'Angga-Tsania-Photobooth.png';
        link.href = out.toDataURL('image/png');
        link.click();
    }

    function kembali() {
        sessionStorage.setItem('musikWaktu', lagu.currentTime.toString());
        sessionStorage.setItem('musikAktif', lagu.paused ? 'false' : 'true');
        window.location.href = 'galeri.html';
    }
    </script>
